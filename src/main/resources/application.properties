quarkus.datasource.db-kind=postgresql

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.jdbc.statement-batch-size=0

# ---- PROD CORS (Render) ----
%prod.quarkus.http.cors=true
%prod.quarkus.http.cors.origins-regex=.*
%prod.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%prod.quarkus.http.cors.headers=Content-Type,Authorization
%prod.quarkus.http.cors.exposed-headers=*
%prod.quarkus.http.cors.access-control-allow-credentials=false
%prod.quarkus.http.cors.access-control-max-age=86400

